name: Update tracker data

on:
  # Daily run at 23:00 UTC (08:00 KST next day)
  schedule:
    - cron: "0 23 * * *"
  # Manual trigger from Actions tab
  workflow_dispatch:
  # Re-run when fetcher logic changes
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore(data): refresh $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
            echo "✅ data.json updated and pushed"
          else
            echo "ℹ️ No changes to data.json — skipping commit"
          fi
